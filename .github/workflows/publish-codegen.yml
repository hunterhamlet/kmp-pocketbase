name: Publish Codegen Plugin to GitHub Packages

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'codegen-v*.*.*'
    paths:
      - 'codegen/build.gradle.kts'
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew -p codegen test

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          output=$(./gradlew -p codegen publishAllPublicationsToGitHubPackagesRepository 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            if echo "$output" | grep -q "409\|Conflict"; then
              echo ""
              echo "⚠️  Publication skipped: this version is already published in GitHub Packages."
              echo "    To release a new version, bump the version in codegen/build.gradle.kts."
              exit 0
            fi
            exit $exit_code
          fi
