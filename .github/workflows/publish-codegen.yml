name: Publish Codegen Plugin to GitHub Packages

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'codegen-v*.*.*'
    paths:
      - 'codegen/build.gradle.kts'
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew -p codegen test

      - name: Publish to GitHub Packages
        run: ./gradlew -p codegen publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
