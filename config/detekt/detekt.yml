build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

# detekt-formatting is NOT used — ktlint owns all formatting rules.
# This prevents any rule duplication between the two tools.

complexity:
  LongParameterList:
    active: true
    functionThreshold: 8      # Composable functions legitimately have many params
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated: ['Composable', 'Preview']
  LongMethod:
    active: true
    threshold: 60             # Composable trees tend to be longer than regular functions
    ignoreAnnotated: ['Composable', 'Preview']
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 10
    thresholdInObjects: 15
    thresholdInEnums: 7
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  NestedBlockDepth:
    active: true
    threshold: 5              # Compose nesting is deep by nature

naming:
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'  # allow underscores (kmp_pocketbase)
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'   # allow PascalCase for @Composable
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '0f', '1f', '0.5f', '100f']
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    active: true
    max: 3
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    active: false             # delegated to ktlint via .editorconfig max_line_length
  WildcardImport:
    active: true
    excludeImports:
      - 'kotlinx.coroutines.*'
      - 'androidx.compose.*'
      - 'org.jetbrains.compose.*'

potential-bugs:
  UnsafeCallOnNullableType:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
